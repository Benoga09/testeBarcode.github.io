<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leitor de código de barras</title>
<style>
:root{
  --verde:#2f9e41;--verde-esc:#237a31;--vermelho:#cd191e;--texto:#333;--suave:#6b6b6b;
  --linha:#dcdcdc;--fundo:#fff;--cinza:#f4f5f4;color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:"Open Sans","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:16px}

/* Cabeçalho com a logo */
header{padding:4px 0 14px;border-bottom:3px solid var(--verde);margin-bottom:16px}
.logo{position:relative;width:100%;max-width:460px}
.logo img{display:block;width:100%;height:auto;-webkit-user-select:none;user-select:none}
.logo button.dot{position:absolute;left:3.680%;top:16.038%;transform:translate(-50%,-50%);width:10.390%;min-width:34px;aspect-ratio:1;margin:0;padding:0;border:0;border-radius:50%;background:transparent!important;display:block;cursor:pointer;-webkit-tap-highlight-color:transparent}
.logo button.dot.on::after{content:"";position:absolute;inset:27%;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--vermelho)}
h1{margin:6px 0 0;font-size:.95rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--texto)}
h2{font-size:.95rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:24px 0 8px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--verde)}

/* Área da câmera: retângulo fixo, não cresce ao escanear */
#reader{width:100%;aspect-ratio:16/9;overflow:hidden;position:relative;background:#1d1d1d;border-radius:8px;border:2px solid var(--verde)}
#reader:empty::before{content:"A câmera abre aqui";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cfcfcf;font-size:.95rem}
#reader:empty::after{content:"";position:absolute;left:5%;right:5%;top:27%;bottom:27%;border:2px dashed rgba(255,255,255,.55);border-radius:6px}
#reader video{width:100%!important;height:100%!important;object-fit:cover;display:block}
#reader img{display:none}
#qr-shaded-region{border-color:rgba(0,0,0,.5)!important}
#qr-shaded-region>div{background-color:var(--verde)!important}

button,label.btn{display:block;width:100%;margin-top:10px;padding:14px;font:inherit;font-weight:700;border-radius:8px;border:2px solid var(--verde);background:var(--verde);color:#fff;text-align:center;cursor:pointer}
button:hover:not(:disabled){background:var(--verde-esc);border-color:var(--verde-esc)}
button.sec,label.btn{background:#fff;color:var(--verde-esc)}
button.sec:hover:not(:disabled),label.btn:hover{background:var(--cinza)}
button:disabled{opacity:.5;cursor:not-allowed}
input[type=file]{display:none}
:focus-visible{outline:3px solid var(--vermelho);outline-offset:2px}

#status{margin:10px 0 0;color:var(--suave);font-size:.95rem;min-height:1.4em}
#status.err{color:var(--vermelho);font-weight:600}

#tools{display:none}
#zoomRow{display:none;align-items:center;gap:10px;margin-top:10px;font-weight:600}
#zoomRow input{flex:1;min-height:32px;accent-color:var(--verde)}
#torch{display:none}

#manual{display:flex;gap:8px}
#manual input{flex:1;min-width:0;padding:14px;font:inherit;border:2px solid var(--linha);border-radius:8px;background:#fff;color:var(--texto)}
#manual input:focus{border-color:var(--verde);outline:none}
#manual button{width:auto;margin-top:0;padding:14px 20px}

#result{display:none;margin-top:16px;padding:14px;background:var(--cinza);border-left:6px solid var(--verde);border-radius:8px}
#result small{color:var(--suave);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
#code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.4rem;font-weight:700;word-break:break-all;margin:4px 0 0}

/* Modo dev */
#devpanel{display:none;margin-top:10px;background:#111;color:#e6e6e6;border-radius:8px;border:2px solid var(--vermelho);padding:10px;font-size:.78rem}
.devhead{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;color:#ff8a8d}
.devhead span{color:#aaa;font-size:.72rem;text-align:right}
#devlive{margin:0 0 6px;padding:6px;background:#1c1c1c;border-radius:6px;white-space:pre-wrap;word-break:break-word;font:inherit;color:#9be7a4}
#devlog{height:170px;overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;line-height:1.35;background:#000;border-radius:6px;padding:6px}
#devlog div{white-space:pre-wrap;word-break:break-word}
.l-erro{color:#ff8a8d}.l-ok{color:#7ee08b}.l-info{color:#d0d0d0}
.devbtns{display:flex;gap:8px}
.devbtns button{margin-top:8px;padding:8px;font-size:.85rem}
</style>
</head>

  <div id="devpanel">
    <div class="devhead"><strong>MODO DEV</strong><span>toque no ponto vermelho para fechar</span></div>
    <pre id="devlive"></pre>
    <div id="devlog" aria-live="off"></div>
    <div class="devbtns"><button class="sec" id="devcopy" type="button">Copiar log</button><button class="sec" id="devclear" type="button">Limpar</button></div>
  </div>
  <div id="tools">
    <button class="sec" id="torch">Ligar lanterna</button>
    <div id="zoomRow"><label for="zoom">Zoom</label><input type="range" id="zoom"></div>
  </div>
  <p id="status" role="status">Toque em “Iniciar leitura”.</p>
  <button id="start">Iniciar leitura</button>
  <label class="btn" for="file">Ler a partir de uma foto</label>
  <input type="file" id="file" accept="image/*" capture="environment">

  <h2>Digitar o número</h2>
  <form id="manual" autocomplete="off">
    <input id="num" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Digite o código" aria-label="Número do código de barras">
    <button type="submit">Usar</button>
  </form>

  <div id="result"><small id="fmt"></small><div id="code"></div><button class="sec" id="copy">Copiar</button></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var statusEl=$('status'),startBtn=$('start'),resultEl=$('result'),torchBtn=$('torch'),zoomEl=$('zoom'),
      scanner=null,running=false,torchOn=false;

  function say(t,err){statusEl.textContent=t;statusEl.className=err?'err':'';dlog(err?'erro':'info',t);}

  // ---------- MODO DEV (clique no ponto vermelho da logo) ----------
  var logEl=$('devlog'),liveEl=$('devlive'),panel=$('devpanel'),dotBtn=$('devdot'),
      logs=[],cnt={frames:0,reads:0,errs:{}},lastErr='',liveT=0;
  function ts(){var d=new Date();return d.toTimeString().slice(0,8)+'.'+('00'+d.getMilliseconds()).slice(-3);}
  function dlog(tipo,msg){
    var line=ts()+'  '+msg;logs.push(line);if(logs.length>500)logs.shift();
    var div=document.createElement('div');div.className='l-'+tipo;div.textContent=line;logEl.appendChild(div);
    while(logEl.childNodes.length>300)logEl.removeChild(logEl.firstChild);
    logEl.scrollTop=logEl.scrollHeight;
  }
  function liveRender(){
    var v=document.querySelector('#reader video');
    liveEl.textContent='Tentativas sem código: '+cnt.frames+'   |   Leituras: '+cnt.reads+
      '\nÚltimo erro: '+(lastErr||'—')+
      '\nVídeo: '+((v&&v.videoWidth)?v.videoWidth+'×'+v.videoHeight:'—')+'   |   Câmera: '+(running?'ligada':'parada');
  }
  function resetCounters(){cnt={frames:0,reads:0,errs:{}};lastErr='';liveRender();}
  // chamado pela biblioteca a cada quadro analisado sem encontrar código
  function onFrameError(msg){
    cnt.frames++;
    var k=String(msg).replace(/^.*?error = /,'').slice(0,80);
    cnt.errs[k]=(cnt.errs[k]||0)+1;
    if(cnt.errs[k]===1)dlog('erro','Tentativa sem código: '+String(msg).slice(0,200));
    else if(cnt.frames%50===0)dlog('info','… '+cnt.frames+' tentativas sem código até agora');
    lastErr=k;
    var n=Date.now();if(n-liveT>250){liveT=n;liveRender();}
  }
  function logCaps(){
    var tr=getTrack();if(!tr){dlog('erro','Sem trilha de vídeo ativa.');return;}
    var st=tr.getSettings?tr.getSettings():{},c=tr.getCapabilities?tr.getCapabilities():{};
    dlog('info','Câmera: '+(tr.label||'?')+' | '+st.width+'×'+st.height+' @'+Math.round(st.frameRate||0)+'fps');
    dlog('info','Recursos: lanterna='+(c.torch?'sim':'não')+', zoom='+(c.zoom?c.zoom.min+'–'+c.zoom.max:'não')+', foco='+(c.focusMode?c.focusMode.join('/'):'?'));
  }
  dotBtn.onclick=function(){
    var on=panel.style.display!=='block';
    panel.style.display=on?'block':'none';dotBtn.classList.toggle('on',on);dotBtn.setAttribute('aria-pressed',on?'true':'false');
    if(on){liveRender();logEl.scrollTop=logEl.scrollHeight;}
  };
  $('devclear').onclick=function(){logEl.innerHTML='';logs=[];};
  $('devcopy').onclick=function(){
    var b=this,t=logs.join('\n'),done=function(){b.textContent='Copiado';setTimeout(function(){b.textContent='Copiar log';},1200);};
    if(navigator.clipboard){navigator.clipboard.writeText(t).then(done,function(){});}
  };
  window.addEventListener('error',function(e){dlog('erro','JS: '+e.message+(e.filename?' ('+String(e.filename).split('/').pop()+':'+e.lineno+')':''));});
  window.addEventListener('unhandledrejection',function(e){dlog('erro','Promessa rejeitada: '+(e.reason&&e.reason.message?e.reason.message:e.reason));});
  dlog('info','Página carregada · HTTPS: '+(window.isSecureContext?'sim':'NÃO')+' · biblioteca: '+(typeof Html5Qrcode!=='undefined'?'carregada':'NÃO carregada')+' · leitor nativo: '+(('BarcodeDetector' in window)?'sim':'não'));
  dlog('info','Navegador: '+navigator.userAgent.slice(0,110));
  // ---------- fim do modo dev ----------

  function show(text,res,label){
    try{if(navigator.vibrate)navigator.vibrate(100);}catch(e){}
    var f=label||'';
    if(!f){try{f='Formato: '+res.result.format.formatName.replace(/_/g,' ');}catch(e){}}
    $('fmt').textContent=f;$('code').textContent=text;resultEl.style.display='block';
    cnt.reads++;dlog('ok','LIDO: '+text+(f?'  ['+f+']':''));liveRender();
    $('copy').textContent='Copiar';
  }

  // Digitar o número manualmente (funciona mesmo sem a biblioteca de leitura)
  $('manual').onsubmit=function(e){
    e.preventDefault();
    var v=$('num').value.trim();
    if(!v){say('Digite o número do código.',true);return;}
    say('Número registrado.');show(v,null,'Digitado manualmente');
  };

  $('copy').onclick=function(){
    var t=$('code').textContent,b=this;
    var done=function(){b.textContent='Copiado';setTimeout(function(){b.textContent='Copiar';},1200);};
    if(navigator.clipboard){navigator.clipboard.writeText(t).then(done,function(){});}
  };

  if(typeof Html5Qrcode==='undefined'){
    say('Não foi possível carregar a biblioteca de leitura. Você ainda pode digitar o número abaixo.',true);
    startBtn.disabled=true;$('file').disabled=true;return;
  }

  var F=Html5QrcodeSupportedFormats;
  var formats=['QR_CODE','AZTEC','CODABAR','CODE_39','CODE_93','CODE_128','DATA_MATRIX','ITF','EAN_13','EAN_8','PDF_417','RSS_14','RSS_EXPANDED','UPC_A','UPC_E']
    .map(function(n){return F[n];}).filter(function(v){return v!==undefined;});
  function make(){return new Html5Qrcode('reader',{formatsToSupport:formats,verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}});}

  function getTrack(){
    var v=document.querySelector('#reader video');
    return (v&&v.srcObject&&v.srcObject.getVideoTracks)?v.srcObject.getVideoTracks()[0]:null;
  }
  function setupControls(){
    var tr=getTrack(),caps=(tr&&tr.getCapabilities)?tr.getCapabilities():{};
    $('tools').style.display='block';
    torchOn=false;torchBtn.textContent='Ligar lanterna';
    torchBtn.style.display=caps.torch?'block':'none';
    if(caps.zoom){
      zoomEl.min=caps.zoom.min;zoomEl.max=caps.zoom.max;zoomEl.step=caps.zoom.step||0.1;
      var cur=(tr.getSettings&&tr.getSettings().zoom)||caps.zoom.min;zoomEl.value=cur;
      $('zoomRow').style.display='flex';
    }else{$('zoomRow').style.display='none';}
  }
  function hideControls(){$('tools').style.display='none';torchOn=false;}

  torchBtn.onclick=function(){
    var tr=getTrack();if(!tr)return;
    var want=!torchOn;
    tr.applyConstraints({advanced:[{torch:want}]}).then(function(){
      torchOn=want;dlog('info','Lanterna '+(want?'ligada':'desligada'));torchBtn.textContent=torchOn?'Desligar lanterna':'Ligar lanterna';
    }).catch(function(){say('Este aparelho não permitiu ligar a lanterna.',true);});
  };
  zoomEl.oninput=function(){
    var tr=getTrack();if(!tr)return;
    tr.applyConstraints({advanced:[{zoom:parseFloat(zoomEl.value)}]}).catch(function(e){dlog('erro','Zoom falhou: '+(e&&e.message));});
  };

  function stop(){
    hideControls();
    if(!scanner||!running)return Promise.resolve();
    running=false;
    return scanner.stop().then(function(){scanner.clear();}).catch(function(){});
  }

  startBtn.onclick=function(){
    if(running){stop().then(function(){startBtn.textContent='Iniciar leitura';say('Leitura parada.');});return;}
    if(!window.isSecureContext){say('A câmera só funciona em páginas HTTPS. Você pode digitar o número abaixo.',true);return;}
    resultEl.style.display='none';say('Abrindo a câmera…');
    scanner=make();
    scanner.start(
      {facingMode:'environment'},
      {
        fps:10,
        aspectRatio:16/9,
        // Área de leitura: retângulo largo e baixo, no formato de um código de barras
        qrbox:function(w,h){return {width:Math.floor(w*0.9),height:Math.floor(h*0.45)};},
        videoConstraints:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}
      },
      function(text,res){stop().then(function(){startBtn.textContent='Ler outro código';say('Código lido.');show(text,res);});},
      onFrameError
    ).then(function(){resetCounters();
      running=true;startBtn.textContent='Parar';
      say('Encaixe o código dentro do retângulo, reto e com boa luz.');
      setupControls();logCaps();
    }).catch(function(e){
      running=false;dlog('erro','start falhou: '+(e&&e.name?e.name+' — ':'')+(e&&e.message?e.message:e));
      say('Erro ao abrir a câmera: '+(e&&e.message?e.message:e)+' — use a foto ou digite o número.',true);
    });
  };

  $('file').onchange=function(){
    var f=this.files&&this.files[0];if(!f)return;
    var input=this;say('Lendo a foto…');
    stop().then(function(){
      var s=make();
      return s.scanFile(f,false).then(function(text){
        say('Código lido.');show(text,null);
      }).catch(function(e){
        dlog('erro','Foto: '+(e&&e.message?e.message:e));
        say('Nenhum código encontrado na foto. Tente de novo ou digite o número abaixo.',true);
      }).then(function(){try{s.clear();}catch(e){}input.value='';});
    });
  };
})();
</script>
</body>
</html>
